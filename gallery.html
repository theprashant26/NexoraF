<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F4EF">
  <title>Gallery | Nexora Institute of Professional Studies</title>
  <meta name="description" content="A visual look at the learning spaces, practical sessions, and campus environment at Nexora Institute of Professional Studies.">
  <link rel="canonical" href="gallery.html">
  <meta property="og:title" content="Gallery | Nexora Institute of Professional Studies">
  <meta property="og:description" content="Learning spaces, practical sessions, and campus environment.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/img/placeholders/nx-og-share-01.svg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/brand/nexoralogo.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <script>document.documentElement.classList.add("nx-js");</script>
</head>

<body>
  <a class="nx-skip-link" href="#main">Skip to content</a>
  <div data-nx-site-header></div>

  <main id="main" class="nx-page">
    <section class="nx-phead nx-surface-slab" data-mast aria-labelledby="page-title">
      <div class="nx-container">
        <div class="nx-phead__kicker">
          <span class="nx-label nx-label--blue" data-mast-kicker>Inside Nexora</span>
          <span class="nx-rule" data-mast-rule></span>
          <span class="nx-label">06 images</span>
        </div>
        <h1 class="nx-phead__title" id="page-title" data-mast-title>See the learning <span class="nx-hl">environment</span>.</h1>
        <div class="nx-phead__sub">
          <p class="nx-lede" data-reveal>Institute photography will replace these placeholders once approved images are supplied.</p>
          
        </div>
      </div>
    </section>

    <section class="nx-section nx-divide" aria-labelledby="grid-title">
      <div class="nx-container">
        <h2 class="nx-visually-hidden" id="grid-title">Gallery</h2>

        <div class="nx-filter-row" role="group" aria-label="Filter the gallery" data-reveal>
          <button class="nx-filter is-active" type="button" data-gallery-filter="all" aria-pressed="true">All</button>
          <button class="nx-filter" type="button" data-gallery-filter="campus" aria-pressed="false">Campus</button>
          <button class="nx-filter" type="button" data-gallery-filter="learning" aria-pressed="false">Learning</button>
          <button class="nx-filter" type="button" data-gallery-filter="people" aria-pressed="false">People</button>
        </div>

        <div class="nx-tiles nx-tiles--gallery">
          <button class="nx-tile" type="button" data-reveal data-gallery-item data-gallery-category="campus"
                  data-gallery-src="assets/img/placeholders/nx-tile-01.svg"
                  data-gallery-alt="Campus and classroom environment">
            <span class="nx-visually-hidden">Open image: campus and classroom environment</span>
            <span class="nx-media nx-media--4-3">
              <img src="assets/img/placeholders/nx-tile-01.svg" width="1600" height="1200" loading="lazy" decoding="async" alt="">
            </span>
          </button>
          <button class="nx-tile" type="button" data-reveal data-gallery-item data-gallery-category="learning"
                  data-gallery-src="assets/img/placeholders/nx-tile-01.svg"
                  data-gallery-alt="Practical learning session">
            <span class="nx-visually-hidden">Open image: practical learning session</span>
            <span class="nx-media nx-media--4-3">
              <img src="assets/img/placeholders/nx-tile-01.svg" width="1600" height="1200" loading="lazy" decoding="async" alt="">
            </span>
          </button>
          <button class="nx-tile" type="button" data-reveal data-gallery-item data-gallery-category="learning"
                  data-gallery-src="assets/img/placeholders/nx-tile-01.svg"
                  data-gallery-alt="Learning materials and equipment detail">
            <span class="nx-visually-hidden">Open image: learning materials and equipment detail</span>
            <span class="nx-media nx-media--4-3">
              <img src="assets/img/placeholders/nx-tile-01.svg" width="1600" height="1200" loading="lazy" decoding="async" alt="">
            </span>
          </button>
          <button class="nx-tile" type="button" data-reveal data-gallery-item data-gallery-category="people"
                  data-gallery-src="assets/img/placeholders/nx-tile-01.svg"
                  data-gallery-alt="Group learning session">
            <span class="nx-visually-hidden">Open image: group learning session</span>
            <span class="nx-media nx-media--4-3">
              <img src="assets/img/placeholders/nx-tile-01.svg" width="1600" height="1200" loading="lazy" decoding="async" alt="">
            </span>
          </button>
          <button class="nx-tile" type="button" data-reveal data-gallery-item data-gallery-category="people"
                  data-gallery-src="assets/img/placeholders/nx-tile-01.svg"
                  data-gallery-alt="Instructor in a practical setting">
            <span class="nx-visually-hidden">Open image: instructor in a practical setting</span>
            <span class="nx-media nx-media--4-3">
              <img src="assets/img/placeholders/nx-tile-01.svg" width="1600" height="1200" loading="lazy" decoding="async" alt="">
            </span>
          </button>
          <button class="nx-tile" type="button" data-reveal data-gallery-item data-gallery-category="campus"
                  data-gallery-src="assets/img/placeholders/nx-tile-01.svg"
                  data-gallery-alt="Campus detail">
            <span class="nx-visually-hidden">Open image: campus detail</span>
            <span class="nx-media nx-media--4-3">
              <img src="assets/img/placeholders/nx-tile-01.svg" width="1600" height="1200" loading="lazy" decoding="async" alt="">
            </span>
          </button>
        </div>
      </div>
    </section>

    <section class="nx-cta nx-surface-blue" aria-labelledby="cta-title">
      <div class="nx-container nx-cta__inner">
        <div class="nx-stack">
          <span class="nx-label" data-reveal>Come and see</span>
          <h2 class="nx-cta__title" id="cta-title" data-wipe>Visit, or start with a question.</h2>
        </div>
        <div class="nx-btn-row" data-reveal>
          <a class="nx-btn nx-btn--invert nx-btn--lg" href="contact.html">Contact the institute <i class="bi bi-arrow-right" aria-hidden="true"></i></a>
        </div>
      </div>
    </section>
  </main>

  <div data-nx-site-footer></div>

  <div class="nx-lightbox" data-lightbox aria-hidden="true">
    <div class="nx-lightbox__dialog" role="dialog" aria-modal="true" aria-label="Image viewer">
      <button class="nx-btn nx-btn--ghost nx-btn--sm nx-lightbox__close" type="button" data-lightbox-close>
        Close <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
      <button class="nx-lightbox__nav nx-lightbox__nav--prev" type="button" data-lightbox-prev aria-label="Previous image">
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
      </button>
      <button class="nx-lightbox__nav nx-lightbox__nav--next" type="button" data-lightbox-next aria-label="Next image">
        <i class="bi bi-chevron-right" aria-hidden="true"></i>
      </button>
      <figure class="nx-lightbox__figure">
        <img data-lightbox-image src="" alt="">
        <figcaption class="nx-lightbox__caption" data-lightbox-caption></figcaption>
      </figure>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
  <script src="assets/js/nav.js" defer></script>
  <script src="assets/js/gallery.js" defer></script>
  <script src="assets/js/motion.js" defer></script>
  <script src="assets/js/seo.js" defer></script>
</body>
</html>
